server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: any path that doesn't match a real file falls back to
  # index.html so React Router can handle it on the client side.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long cache for hashed Vite assets, no cache for the entry HTML.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
